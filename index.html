<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evgeny's Apps</title>

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            background: #111827;
            font-family: Arial, sans-serif;
        }

        .app-button {
            display: inline-block;
            min-width: 340px;
            padding: 24px 42px;
            border-radius: 14px;
            background: white;
            color: #111827;
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .app-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
        }

        @media (max-width: 480px) {
            .app-button {
                min-width: 0;
                width: 80%;
                padding: 20px 16px;
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <a
        class="app-button"
        href="http://85.130.232.197:8002/beethoven/"
    >
        Beethoven 32 Sonatas
    </a>

    <a
        class="app-button"
        href="https://85.130.232.197/score_site/index.html"
    >
        Score Site
    </a>

    <a
        class="app-button"
        href="https://85.130.232.197/score_site_professional/index.html"
    >
        Score Professional
    </a>
</body>
</html>
